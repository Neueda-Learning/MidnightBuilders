spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Keep integration tests fast; timing boundaries are covered with unit-test fakes.
payment.simulation.min-delay-seconds=0
payment.simulation.max-delay-seconds=0
payment.simulation.timeout-seconds=10
payment.simulation.max-retries=3
