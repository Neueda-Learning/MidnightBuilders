# Local profile for app on Windows connecting to MySQL in Linux VM.
spring.datasource.url=${LOCAL_DB_URL:jdbc:mysql://10.10.130.140:8081/payment_processing?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${LOCAL_DB_USERNAME:payment_user}
spring.datasource.password=${LOCAL_DB_PASSWORD:payment_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

payment.simulation.min-delay-seconds=0
payment.simulation.max-delay-seconds=20
payment.simulation.timeout-seconds=10
payment.simulation.max-retries=3
spring.jpa.show-sql=false

logging.level.root=INFO
logging.level.com.example.demo=INFO
logging.level.org.springframework.web=INFO
