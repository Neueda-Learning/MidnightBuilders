spring.application.name=payment-processing

# MySQL connection (values come from .env or OS env vars)
spring.datasource.url=${DB_URL:jdbc:mysql://10.10.130.140:8081/payment_processing?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:payment_user}
spring.datasource.password=${DB_PASSWORD:payment_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Use versioned migration scripts instead of runtime schema mutation.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

logging.level.root=INFO
logging.level.com.example.demo=INFO
logging.level.org.springframework.web=INFO

payment.simulation.min-delay-seconds=0
payment.simulation.max-delay-seconds=20
payment.simulation.timeout-seconds=10
payment.simulation.max-retries=3
